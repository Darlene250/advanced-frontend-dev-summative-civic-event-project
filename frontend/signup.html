<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up - Civic Event</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white rounded-xl shadow p-6">
    <h1 class="text-2xl font-bold text-slate-800 mb-4">Create account</h1>

    <form id="signupForm" class="space-y-4">
      <div>
        <label for="full_name" class="block text-sm font-medium">Full name</label>
        <input id="full_name" type="text" required class="w-full border rounded p-2" />
      </div>
      <div>
        <label for="email" class="block text-sm font-medium">Email</label>
        <input id="email" type="email" required class="w-full border rounded p-2" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium">Password</label>
        <input id="password" type="password" required class="w-full border rounded p-2" />
        <div class="h-2 bg-slate-200 rounded mt-2" aria-hidden="true">
          <div id="strengthBar" class="h-2 rounded w-0"></div>
        </div>
        <p id="strengthText" class="text-xs mt-1" aria-live="polite"></p>
      </div>
      <div>
        <label for="confirm_password" class="block text-sm font-medium">Confirm password</label>
        <input id="confirm_password" type="password" required class="w-full border rounded p-2" />
      </div>
      <p id="error" role="alert" class="text-red-700 text-sm"></p>
      <button type="submit" class="w-full bg-indigo-700 text-white rounded p-2 font-semibold">Sign up</button>
    </form>

    <p class="text-sm mt-4">Already have an account? <a href="login.html" class="text-indigo-700 underline">Login</a></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
