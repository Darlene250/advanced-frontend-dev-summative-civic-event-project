<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Promos - Civic Event</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">
  <div id="navbar"></div>

  <main class="max-w-4xl mx-auto w-full p-4 flex-1">
    <h1 class="text-2xl font-bold mb-4">Promos</h1>
    <p id="message" role="status" class="text-red-700 mb-2"></p>

    <!-- ADMIN ONLY: create form (shown by promos.js) -->
    <section id="adminBox" class="hidden bg-white rounded-xl shadow p-4 mb-6">
      <h2 class="font-bold mb-2">New promo (admin)</h2>
      <form id="promoForm" class="space-y-3">
        <div>
          <label for="title" class="block text-sm font-medium">Title</label>
          <input id="title" type="text" required class="w-full border rounded p-2" />
        </div>
        <div>
          <label for="description" class="block text-sm font-medium">Description</label>
          <textarea id="description" rows="2" required class="w-full border rounded p-2"></textarea>
        </div>
        <div>
          <label for="caption_text" class="block text-sm font-medium">Caption text (shown as subtitles)</label>
          <input id="caption_text" type="text" required class="w-full border rounded p-2" />
        </div>
        <div>
          <label for="video" class="block text-sm font-medium">Video file (max 8 MB)</label>
          <input id="video" type="file" accept="video/*" required />
        </div>
        <p id="formMsg" role="alert" class="text-sm text-red-700"></p>
        <button id="saveBtn" type="submit" class="bg-indigo-700 text-white rounded px-4 py-2 font-semibold">Publish</button>
      </form>
    </section>

    <div id="list" class="grid gap-4 sm:grid-cols-2"></div>
  </main>

  <div id="footer"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/promos.js"></script>
</body>
</html>
