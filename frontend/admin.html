<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin dashboard - Civic Event</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">
  <div id="navbar"></div>

  <main class="max-w-6xl mx-auto w-full p-4 flex-1">
    <h1 class="text-2xl font-bold mb-4">Admin dashboard</h1>
    <p id="message" role="alert" class="text-red-700 mb-2"></p>

    <!-- Counts -->
    <section id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8" aria-label="Statistics"></section>

    <!-- Users -->
    <h2 class="text-xl font-bold mb-3">Users</h2>
    <div class="bg-white rounded-xl shadow overflow-x-auto">
      <table class="w-full text-sm text-left">
        <caption class="sr-only">List of users</caption>
        <thead class="bg-slate-200">
          <tr>
            <th scope="col" class="p-3">Name</th>
            <th scope="col" class="p-3">Email</th>
            <th scope="col" class="p-3">Role</th>
            <th scope="col" class="p-3">Status</th>
            <th scope="col" class="p-3">Action</th>
          </tr>
        </thead>
        <tbody id="users"></tbody>
      </table>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
